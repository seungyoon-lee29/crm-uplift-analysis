<!-- @dsCard group="Components" name="Input" subtitle="Default / focus / error / disabled" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Input — My Design System</title>
<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --color-primary-500: #6366f1; --color-primary-100: #e0e7ff;
    --color-neutral-0: #fff; --color-neutral-100: #f1f5f9; --color-neutral-300: #cbd5e1;
    --color-neutral-500: #64748b; --color-neutral-700: #334155; --color-neutral-900: #0f172a; --color-neutral-50: #f8fafc;
    --color-danger: #dc2626;
    --radius-md: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; font-family: var(--font-sans); background: var(--color-neutral-50); color: var(--color-neutral-900); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: var(--color-neutral-500); font-size: 13px; }
  .field { max-width: 320px; margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--color-neutral-700); }
  .field .hint { font-size: 12px; margin-top: 6px; color: var(--color-neutral-500); }
  .field .hint.err { color: var(--color-danger); }
  .input { width: 100%; font-family: inherit; font-size: 14px; padding: 10px 12px; border-radius: var(--radius-md); border: 1px solid var(--color-neutral-300); background: var(--color-neutral-0); color: var(--color-neutral-900); outline: none; transition: border-color .12s, box-shadow .12s; }
  .input::placeholder { color: var(--color-neutral-500); }
  .input:focus, .input.is-focus { border-color: var(--color-primary-500); box-shadow: 0 0 0 3px var(--color-primary-100); }
  .input.is-error { border-color: var(--color-danger); box-shadow: 0 0 0 3px rgba(220,38,38,.15); }
  .input:disabled { background: var(--color-neutral-100); color: var(--color-neutral-500); cursor: not-allowed; }
</style>
</head>
<body>
  <h1>Input</h1>
  <p class="sub">Text field with default, focus, error and disabled states.</p>

  <div class="field">
    <label>Default</label>
    <input class="input" placeholder="you@example.com" />
  </div>
  <div class="field">
    <label>Focused</label>
    <input class="input is-focus" value="typing…" />
  </div>
  <div class="field">
    <label>Error</label>
    <input class="input is-error" value="not-an-email" />
    <div class="hint err">Enter a valid email address.</div>
  </div>
  <div class="field">
    <label>Disabled</label>
    <input class="input" value="Read only" disabled />
  </div>
</body>
</html>
