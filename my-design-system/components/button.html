<!-- @dsCard group="Components" name="Button" subtitle="Primary / secondary / ghost / danger · 3 sizes" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Button — My Design System</title>
<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --color-primary-600: #4f46e5; --color-primary-700: #4338ca; --color-primary-50: #eef2ff;
    --color-neutral-0: #fff; --color-neutral-100: #f1f5f9; --color-neutral-300: #cbd5e1;
    --color-neutral-500: #64748b; --color-neutral-700: #334155; --color-neutral-900: #0f172a; --color-neutral-50: #f8fafc;
    --color-danger: #dc2626;
    --radius-md: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; font-family: var(--font-sans); background: var(--color-neutral-50); color: var(--color-neutral-900); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: var(--color-neutral-500); font-size: 13px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--color-neutral-500); margin: 24px 0 12px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  .btn { font-family: inherit; font-weight: 600; border-radius: var(--radius-md); border: 1px solid transparent; cursor: pointer; transition: background .12s, border-color .12s; line-height: 1; }
  .btn-sm { font-size: 13px; padding: 7px 12px; }
  .btn-md { font-size: 14px; padding: 10px 16px; }
  .btn-lg { font-size: 16px; padding: 13px 22px; }

  .btn-primary { background: var(--color-primary-600); color: #fff; }
  .btn-primary:hover { background: var(--color-primary-700); }
  .btn-secondary { background: var(--color-neutral-0); color: var(--color-neutral-700); border-color: var(--color-neutral-300); }
  .btn-secondary:hover { background: var(--color-neutral-100); }
  .btn-ghost { background: transparent; color: var(--color-primary-600); }
  .btn-ghost:hover { background: var(--color-primary-50); }
  .btn-danger { background: var(--color-danger); color: #fff; }
  .btn-danger:hover { filter: brightness(.93); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
  <h1>Button</h1>
  <p class="sub">Four variants, three sizes, plus disabled state.</p>

  <h2>Variants</h2>
  <div class="row">
    <button class="btn btn-md btn-primary">Primary</button>
    <button class="btn btn-md btn-secondary">Secondary</button>
    <button class="btn btn-md btn-ghost">Ghost</button>
    <button class="btn btn-md btn-danger">Danger</button>
    <button class="btn btn-md btn-primary" disabled>Disabled</button>
  </div>

  <h2>Sizes</h2>
  <div class="row">
    <button class="btn btn-sm btn-primary">Small</button>
    <button class="btn btn-md btn-primary">Medium</button>
    <button class="btn btn-lg btn-primary">Large</button>
  </div>
</body>
</html>
