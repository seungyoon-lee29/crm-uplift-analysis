<!-- @dsCard group="Foundations" name="Spacing" subtitle="4px base scale & radii" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spacing — My Design System</title>
<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-6: 24px; --space-8: 32px; --space-12: 48px; --space-16: 64px;
    --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-full: 999px;
    --color-primary-500: #6366f1; --color-neutral-500: #64748b; --color-neutral-900: #0f172a; --color-neutral-50: #f8fafc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; font-family: var(--font-sans); background: var(--color-neutral-50); color: var(--color-neutral-900); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: var(--color-neutral-500); font-size: 13px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--color-neutral-500); margin: 24px 0 12px; }
  .scale-row { display: flex; align-items: center; gap: 12px; padding: 6px 0; }
  .scale-row .label { width: 120px; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--color-neutral-500); }
  .bar { height: 16px; background: var(--color-primary-500); border-radius: 3px; }
  .radii { display: flex; gap: 16px; flex-wrap: wrap; }
  .radii .box { width: 80px; height: 80px; background: var(--color-primary-500); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; color: #fff; font-size: 11px; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
  <h1>Spacing &amp; Radius</h1>
  <p class="sub">Spacing follows a 4px base grid. Radii cover sm → full.</p>

  <h2>Spacing scale</h2>
  <div class="scale-row"><div class="label">space-1 · 4</div><div class="bar" style="width:var(--space-1)"></div></div>
  <div class="scale-row"><div class="label">space-2 · 8</div><div class="bar" style="width:var(--space-2)"></div></div>
  <div class="scale-row"><div class="label">space-3 · 12</div><div class="bar" style="width:var(--space-3)"></div></div>
  <div class="scale-row"><div class="label">space-4 · 16</div><div class="bar" style="width:var(--space-4)"></div></div>
  <div class="scale-row"><div class="label">space-6 · 24</div><div class="bar" style="width:var(--space-6)"></div></div>
  <div class="scale-row"><div class="label">space-8 · 32</div><div class="bar" style="width:var(--space-8)"></div></div>
  <div class="scale-row"><div class="label">space-12 · 48</div><div class="bar" style="width:var(--space-12)"></div></div>
  <div class="scale-row"><div class="label">space-16 · 64</div><div class="bar" style="width:var(--space-16)"></div></div>

  <h2>Radius</h2>
  <div class="radii">
    <div class="box" style="border-radius:var(--radius-sm)">sm · 6</div>
    <div class="box" style="border-radius:var(--radius-md)">md · 10</div>
    <div class="box" style="border-radius:var(--radius-lg)">lg · 16</div>
    <div class="box" style="border-radius:var(--radius-full)">full</div>
  </div>
</body>
</html>
